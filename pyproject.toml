[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentrade-peer-node"
version = "0.1.0-draft"
description = "OpenTrade Protocol — Reference Node Implementation"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
keywords = ["opentrade", "protocol", "marketplace", "federation", "p2p-commerce"]
authors = [
    {name = "OpenTrade Protocol Team", email = "dev@opentradeprotocol.com"},
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "pyyaml>=6.0.1",
    "httpx>=0.26.0",
    "cryptography>=42.0.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "opentrade>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]
ai = [
    "onnxruntime>=1.17.0",
    "torch>=2.1.0",
    "clip>=1.0.0",
]

[project.scripts]
opentrade-peer = "app.cli:main"
migrate = "app.cli:migrate"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
