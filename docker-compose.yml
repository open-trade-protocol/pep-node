services:
  peer-node:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pep-node
    ports:
      - "8000:8000"
    environment:
      - OT_NODE_ID=snow.opentradeprotocol.com
      # PostgreSQL via SQLModel (sync psycopg2 + async asyncpg share this URL)
      - DATABASE_URL=postgresql://opentrade:secret@db:5432/pepnode
      - OT_DATABASE_URL=postgresql://opentrade:secret@db:5432/pepnode
      - OT_MEILISEARCH_URL=http://meilisearch:7700
      - OT_QDRANT_URL=http://qdrant:6333
      - OT_FEDERATION_INDEX_URL=https://api.opentradeprotocol.com/v1
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./config:/app/config

  db:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=pepnode
      - POSTGRES_USER=opentrade
      - POSTGRES_PASSWORD=secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentrade -d pepnode"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6343:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  meilisearch_data:
  qdrant_data:
