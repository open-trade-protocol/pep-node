version: '3.8'

services:
  peer-node:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OT_NODE_ID=snow.opentradeprotocol.com
      - OT_DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/opentrade
      - OT_MEILISEARCH_URL=http://meilisearch:7700
      - OT_QDRANT_URL=http://qdrant:6333
      - OT_FEDERATION_INDEX_URL=https://api.opentradeprotocol.com/v1
    depends_on:
      - db
      - meilisearch
      - qdrant
    volumes:
      - ./config:/app/config

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=opentrade
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  meilisearch_data:
  qdrant_data:
